<style id="daylight-theme">
/* Daylight theme: light background, blue-yellow gradient orb, frosted cards */
:root{--ink:#0B1033;--muted:#5C648F;--green:#3D5AFE;--line:rgba(11,16,51,.09);--paper:#F6F7FB;--lime:#FFC94D;--blue:#3D5AFE;--honey:#FFC94D;--amber:#C98A00;--body:#4A5280;--glass:rgba(255,255,255,.78);--shadow:0 24px 60px rgba(11,16,51,.10);--display:'Space Grotesk',Inter,system-ui,sans-serif}
body{background-color:var(--paper);background-image:radial-gradient(rgba(11,16,51,.10) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:15px/1.65 Inter,system-ui,sans-serif;position:relative;min-height:100vh}
.bg-orb{position:fixed;z-index:-1;right:-140px;top:60px;width:min(760px,90vw);height:min(760px,90vw);border-radius:50%;filter:blur(80px);opacity:.75;overflow:hidden;pointer-events:none}
.bg-orb div{width:100%;height:100%;background:conic-gradient(from 20deg,#3D5AFE,#7C9BFF,#FFD877,#FFC94D,#8FB0FF,#3D5AFE);animation:orbspin 28s linear infinite}
.bg-orb.two{right:auto;left:-260px;top:auto;bottom:-280px;width:560px;height:560px;opacity:.35}
@keyframes orbspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bg-orb div{animation:none}}
h1,h2,h3,.brand,.balance,.section-title{font-family:var(--display);letter-spacing:-.025em}
button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 18px;color:var(--ink);font-weight:500;transition:background .15s,border-color .15s,transform .15s}
button:hover{border-color:rgba(11,16,51,.22)}
button:focus-visible,a:focus-visible{outline:3px solid #7C9BFF;outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.primary:hover{background:#1F2766;border-color:#1F2766}
header{background:transparent;border-bottom:0;position:sticky;top:0;z-index:5;padding:16px 16px 0}
.bar{max-width:1160px;padding:10px 12px 10px 20px;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(11,16,51,.06)}
.brand{font-size:21px;font-weight:700;background:none;border:0}
.mark,.mark[aria-hidden]{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#3D5AFE,#7C9BFF 55%,#FFC94D);color:#fff;font-size:16px}
.bar nav{gap:2px}
.bar nav button{border:0;background:transparent;color:var(--body);font-size:15px;padding:8px 14px}
.bar nav button:hover{background:rgba(61,90,254,.07);color:var(--ink)}
.bar nav button[aria-current=true]{background:rgba(61,90,254,.1);color:var(--blue);font-weight:600}
.account button{padding:8px 16px}
.wrap{padding-top:36px}
.ask-panel{position:relative;background:var(--glass);border:1px solid #fff;border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:48px 48px 40px}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
.ask-panel h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.04em;margin:0 0 16px}
.grad{background:linear-gradient(90deg,#3D5AFE 0%,#6F7CFF 45%,#F2A900 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ask-panel .intro{color:var(--body);font-size:18px;line-height:1.55;margin:0 0 26px;max-width:620px}
.ask-panel form{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(11,16,51,.06);padding:12px}
.ask-panel textarea{font-size:17px;color:var(--ink)}
.ask-panel textarea::placeholder{color:#7A82A8}
.ask-panel textarea:focus-visible{outline:2px solid #7C9BFF}
.ask-panel .primary{padding:12px 24px}
.hot{gap:10px;margin:22px 0 40px}
.hot strong{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hot button{background:#fff;font-size:14px;padding:8px 16px;box-shadow:0 8px 20px rgba(11,16,51,.06)}
.hot button:hover{color:var(--blue)}
.section-title{font-size:28px;margin-bottom:16px}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 14px 40px rgba(11,16,51,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:22px 26px;margin-bottom:14px}
.card h3{font-size:20px}
.ticket{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,236,186,.65))}
.sidebar .points,.points{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(205,215,255,.7))}
.tag{background:rgba(61,90,254,.08);color:var(--blue);border-radius:999px;padding:4px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.02em}
.ticket .tag{background:rgba(255,201,77,.28);color:#7A5300}
.tabs button{background:#fff;font-size:14px;padding:7px 15px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.meta,.summary,small{color:var(--muted)}
.summary{color:var(--body)}
.balance{color:var(--ink);font-weight:700}
.voted{background:rgba(61,90,254,.1);color:var(--blue);border-color:rgba(61,90,254,.3)}
.winner{color:var(--amber)}
.member-link,.map-link,.event-list a,.leaflet-popup-content a{color:var(--blue)}
.empty{background:rgba(255,255,255,.6);border:1px dashed rgba(11,16,51,.18);border-radius:20px}

dialog::backdrop{background:rgba(11,16,51,.35);backdrop-filter:blur(4px)}
input,textarea,select{border:1px solid rgba(11,16,51,.16);border-radius:12px;padding:11px 12px;color:var(--ink)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #7C9BFF;outline-offset:1px}
#notice{background:var(--ink);border-radius:16px;padding:12px 18px;box-shadow:0 16px 40px rgba(11,16,51,.25)}
footer{border-top:1px solid var(--line);color:var(--muted)}
.social-footer{border-top:1px solid var(--line)}
.social-footer span{background:#fff;border:1px solid var(--line);border-radius:999px}
.exchange-head{background:var(--glass);border:1px solid #fff;border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(14px);padding:28px 30px}
.exchange-head h1{font-size:34px}
.exchange-tile{border-radius:22px;border:1px solid rgba(255,255,255,.9);background:var(--glass);box-shadow:0 14px 40px rgba(11,16,51,.07)}
.exchange-cover{background:linear-gradient(135deg,#E6EBFF,#FFF4D6);color:var(--muted)}
.about-copy{background:var(--glass);border:1px solid #fff;border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.about-copy p:last-child{color:var(--blue)}
.about-comic a{border-radius:24px;border:1px solid #fff;box-shadow:var(--shadow)}
.map-frame{border-radius:24px;border:1px solid #fff;box-shadow:var(--shadow);background:#E9EDFB}
.event-pin{background:var(--blue)}
.event-pin.approx{background:#fff;color:var(--blue);border-color:var(--blue)}
.event-team{background:rgba(255,255,255,.7);border-radius:16px}
.event-community summary{color:var(--blue)}
.profile-lists li,.comment-list li,.activity-list li{border-top-color:var(--line)}
.detail h1{font-size:34px;line-height:1.2}
@media(max-width:740px){header{padding:10px 10px 0}.bar{border-radius:24px;padding:10px 12px}.ask-panel{padding:28px 20px;border-radius:24px}.card{padding:18px}.bg-orb{right:-220px;top:120px;opacity:.6}}
@media(max-width:550px){.ask-panel{padding:24px 16px}.ask-panel h1{font-size:36px}.bar nav button{padding:7px 10px;font-size:14px}}

function ago(ts) {
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
  if (diff < 86400) return Math.floor(diff / 3600) + ' h ago';
  if (diff < 7 * 86400) return Math.floor(diff / 86400) + ' d ago';
  return new Date(ts).toLocaleDateString('en-GB', {day:'numeric', month:'short', year: new Date(ts).getFullYear() === new Date().getFullYear() ? undefined : 'numeric'});
}
function ukDate() {
  const parts = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/London', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
  return ['year','month','day'].map(type => parts.find(part => part.type === type).value).join('-');
}

function friendlyError(error) {
  const text = String(error?.message || error || '');
  if (/row-level security|permission denied/i.test(text)) return 'You don’t have permission to do that.';
  if (/check constraint|violates/i.test(text)) return 'Some details aren’t valid. Check the form and try again.';
  if (/Failed to fetch|NetworkError/i.test(text)) return 'We couldn’t reach HerTech. Check your connection and try again.';
  return 'Something went wrong. Please try again.';
}
let lastError = '';
async function run(task, done) {
  try {
    const result = await task();
    if (result?.error) throw result.error;
    if (done) tell(done);
    return result ?? true;
  } catch (error) {
    console.error(error);
    lastError = friendlyError(error);
    tell(lastError);
    return null;
  }
}

// ───────────────────────── Search ─────────────────────────
const terms = text => [...new Set(String(text || '').toLowerCase().split(/[^\p{L}\p{N}+#]+/u).filter(word => word.length > 1))];
function scoreText(fields, words, phrase) {
  let score = 0, matched = 0;
  for (const word of words) {
    let s = 0;
    for (const [text, weight] of fields) if (text.includes(word)) s += weight;
    if (s) matched++;
    score += s;
  }
  if (phrase && fields[0][0].includes(phrase)) score += 8;
  return {score, all: words.length > 0 && matched === words.length, any: matched > 0};
}
function questionScore(q, words, phrase) {
  const answers = answersOf(q.id).map(a => a.body).join(' ').toLowerCase();
  return scoreText([[q.title.toLowerCase(), 5], [q.topic.toLowerCase(), 3], [q.body.toLowerCase(), 2], [answers, 1]], words, phrase);
}
function rank(items, scorer, query) {
  const words = terms(query), phrase = String(query || '').trim().toLowerCase();
  if (!words.length) return {items:[], loose:false};
  const scored = items.map(item => ({item, ...scorer(item, words, phrase)}));
  let hits = scored.filter(s => s.all);
  let loose = false;
  if (!hits.length) { hits = scored.filter(s => s.any); loose = hits.length > 0; }
  return {items: hits.sort((a, b) => b.score - a.score).map(s => s.item), loose};
}
function mark(text, query) {
  const words = terms(query).map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!words.length) return esc(text);
  const re = new RegExp('(' + words.join('|') + ')', 'giu');
  return String(text).split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}
function snippet(text, query, length = 190) {
  const value = String(text || '').replace(/\s+/g, ' ');
  const word = terms(query).find(w => value.toLowerCase().includes(w));
  let start = word ? Math.max(0, value.toLowerCase().indexOf(word) - 60) : 0;
  let out = value.slice(start, start + length);
  return (start > 0 ? '…' : '') + mark(out, query) + (start + length < value.length ? '…' : '');
}

async function loadAll() {
  if (!sb) { db.loaded = true; db.failed = true; render(); return; }
  try {
    sb.rpc('settle_questions').then(() => {}, () => {});
    const results = await Promise.all([
      sb.from('profiles').select('id,name,stage,bio,offers,wants,link,is_admin,is_banned,avatar_url,created_at').limit(5000),
      sb.from('questions').select('*').order('created_at', {ascending:false}).limit(2000),
      sb.from('answers').select('*').order('created_at').limit(10000),
      sb.from('answer_votes').select('answer_id,voter_id').limit(50000),
      sb.from('comments').select('*').order('created_at').limit(10000),
      sb.from('event_groups').select('*').order('created_at'),
      sb.from('event_group_members').select('group_id,member_id'),
      sb.from('follows').select('follower_id,followee_id').limit(20000),
      sb.from('swaps').select('id,author_id,type,title,place,offer,want,from_date,to_date,status,created_at,cover:images->0').order('created_at', {ascending:false}).limit(2000),
      sb.from('resources').select('*').order('created_at', {ascending:false}).limit(2000),
      sb.from('resource_votes').select('resource_id,member_id').limit(20000),
      sb.from('events').select('*').order('ends_on')
    ]);
    const failed = results.find(result => result.error);
    if (failed) throw failed.error;
    const [profiles, questions, answers, votes, comments, groups, groupMembers, follows, swaps, resources, resourceVotes, events] = results.map(result => result.data);
    db.profiles = new Map(profiles.map(p => [p.id, p]));
    Object.assign(db, {questions, answers, votes, comments, groups, groupMembers, follows, swaps, resources, resourceVotes, failed:false});
    db.events = events.map(e => ({id:e.id, name:e.name, city:e.city, date:e.date_label, ends:e.ends_on, venue:e.venue, marker: e.lat != null && e.lng != null ? [e.lat, e.lng] : null, url:e.url}));
    await loadPrivate();
  } catch (error) {
    console.error(error);
    db.failed = true;
  }
  db.loaded = true;
  render();
}
async function loadPrivate() {
  if (!sb || !me) { db.ledger = []; db.messages = []; db.blocks = []; db.reports = []; db.ticket = {places_left:SEATS, mine:false}; return; }
  const [ledger, messages, blocks, ticket] = await Promise.all([
    sb.from('ledger').select('delta,reason,created_at').order('created_at', {ascending:false}),
    sb.from('messages').select('*').order('created_at').limit(5000),
    sb.from('blocks').select('blocked_id'),
    sb.rpc('ticket_status', {event:TICKET, seats:SEATS})
  ]);
  db.ledger = ledger.data || [];
  db.messages = messages.data || [];
  db.blocks = blocks.data || [];
  db.ticket = ticket.data?.[0] || db.ticket;
  const pref = await sb.from('profiles').select('email_notifications').eq('id', me.id).maybeSingle();
  db.notify = pref.data ? pref.data.email_notifications !== false : true;
  if (isAdmin()) { const {data} = await sb.from('reports').select('*').order('created_at', {ascending:false}).limit(500); db.reports = data || []; } else db.reports = [];
}
async function refresh() { await loadAll(); }
function subscribeMessages() {
  if (!sb || !me || realtime) return;
  realtime = sb.channel('dm-' + me.id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload => {
      const msg = payload.new;
      if (!me || ![msg.sender_id, msg.recipient_id].includes(me.id) || db.messages.some(m => m.id === msg.id)) return;
      db.messages.push(msg);
      onNewMessage(msg);
    })
    .subscribe();
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!me || document.hidden) return;
    const last = db.messages.at(-1)?.created_at || '1970-01-01';
    const {data} = await sb.from('messages').select('*').gt('created_at', last).order('created_at');
    for (const msg of data || []) if (!db.messages.some(m => m.id === msg.id)) { db.messages.push(msg); onNewMessage(msg); }
  }, 20000);
}
function unsubscribeMessages() {
  if (realtime) sb.removeChannel(realtime);
  realtime = null;
  clearInterval(pollTimer);
}
function onNewMessage(msg) {
  const {path} = route();
  if (path === 'messages-' + (msg.sender_id === me.id ? msg.recipient_id : msg.sender_id)) {
    renderThreadBody();
    if (msg.recipient_id === me.id) markRead(msg.sender_id);
  } else if (path === 'messages') {
    render();
  } else if (msg.recipient_id === me.id) {
    tell('New message from ' + nameOf(msg.sender_id));
  }
  renderHeader();
}
async function markRead(otherId) {
  const unread = db.messages.filter(m => m.sender_id === otherId && m.recipient_id === me?.id && !m.read_at);
  if (!unread.length) return;
  const now = new Date().toISOString();
  for (const m of unread) m.read_at = now;
  renderHeader();
  await sb.from('messages').update({read_at:now}).eq('sender_id', otherId).eq('recipient_id', me.id).is('read_at', null);
}

function searchPage(params) {

function searchResults(params) {
  const query = params.get('q') || '';
  const section = params.get('in') || 'questions';
  const topic = params.get('topic') || 'All';
  const sort = params.get('sort') || 'best';
  if (!terms(query).length) {
    const unanswered = db.questions.filter(q => !answersOf(q.id).length).slice(0, 4);
    return `<div class="hot" aria-label="Topics"><strong>Browse topics</strong>${TOPICS.map(t => `<button data-action="topic" data-topic="${esc(t)}"># ${esc(t)}</button>`).join('')}</div>
      <h2 class="section-title">Recently asked</h2>${db.questions.slice(0, 5).map(q => questionCard(q)).join('') || '<p class="empty">No questions yet.</p>'}
      ${unanswered.length ? `<h2 class="section-title">Waiting for an answer</h2>${unanswered.map(q => questionCard(q)).join('')}` : ''}`;
  }
  const questions = rank(db.questions.filter(q => topic === 'All' || q.topic === topic), questionScore, query);
  const resources = rank(db.resources.filter(r => r.status === 'approved'), (r, w, p) => scoreText([[r.title.toLowerCase(), 5], [r.category.toLowerCase(), 3], [r.description.toLowerCase(), 2], [domain(r.url), 1]], w, p), query);
  const swaps = rank(db.swaps, (s, w, p) => scoreText([[s.title.toLowerCase(), 5], [s.type.toLowerCase(), 3], [(s.offer + ' ' + s.want).toLowerCase(), 2], [s.place.toLowerCase(), 2]], w, p), query);
  const members = rank([...db.profiles.values()], (m, w, p) => scoreText([[m.name.toLowerCase(), 5], [(m.offers || '').toLowerCase(), 3], [(m.bio || '').toLowerCase() + ' ' + (m.stage || '').toLowerCase(), 1]], w, p), query);
  let qs = questions.items;
  if (sort === 'newest') qs = [...qs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  if (sort === 'unanswered') qs = qs.filter(q => !answersOf(q.id).length);
  const link = changes => { const next = new URLSearchParams(params); for (const [k, v] of Object.entries(changes)) next.set(k, v); return '#search?' + next.toString(); };
  const tabs = [['questions','Questions',questions], ['resources','Resources',resources], ['swaps','Swaps',swaps], ['members','Members',members]];
  const current = tabs.find(t => t[0] === section) || tabs[0];
  let body;
  if (current[0] === 'questions') {
    body = `<div class="tabs" aria-label="Filter by topic">${['All', ...TOPICS].map(t => `<a class="chip" href="${link({topic:t})}" aria-pressed="${t === topic}">${esc(t)}</a>`).join('')}</div>
      <div class="sortbar"><span>Sort</span>${[['best','Best match'],['newest','Newest'],['unanswered','Unanswered']].map(([k,l]) => `<a class="chip" href="${link({sort:k})}" aria-pressed="${k === sort}">${l}</a>`).join('')}</div>
      ${qs.map(q => questionCard(q, query)).join('') || '<p class="empty">No questions match. </p>'}
      <div class="card ask-cta"><strong>Didn’t find what you need?</strong><p class="summary">Ask the community, and other women in UK tech can share their experience.</p><button class="primary" data-action="ask" data-title="${esc(query)}">Ask “${esc(query.slice(0, 60))}”</button></div>`;
  } else if (current[0] === 'resources') {
    body = resources.items.length ? `<div class="res-grid">${resources.items.map(r => resourceCard(r, query, true)).join('')}</div>` : '<p class="empty">No resources match.</p>';
  } else if (current[0] === 'swaps') {
    body = swaps.items.length ? `<div class="exchange-feed">${swaps.items.map(swapTile).join('')}</div>` : '<p class="empty">No swaps match.</p>';
  } else {
    body = members.items.length ? members.items.map(memberRow).join('') : '<p class="empty">No members match.</p>';
  }
  return `<p class="result-line">${current[2].loose ? 'No exact matches, so here are related results for' : 'Results for'} “${esc(query)}”</p>
    <nav class="seg" aria-label="Search sections">${tabs.map(([key,label,res]) => `<a href="${link({in:key})}" aria-current="${key === current[0] ? 'page' : 'false'}">${label} <span>${res.items.length}</span></a>`).join('')}</nav>${body}`;
}

  ${answers.map(a => {

      ${mine ? `<button data-action="edit-answer" data-id="${esc(a.id)}">Edit</button>` : ''}
      ${mine || isAdmin() ? `<button class="danger" data-action="delete" data-table="answers" data-id="${esc(a.id)}">Delete</button>` : ''}
      ${!mine && me ? `<a class="btn ghost" href="#messages-${esc(a.author_id)}">Message</a>` : ''}${reportBtn('answer', a.id, a.author_id)}</div>

const coverOk = url => typeof url === 'string' && /^https:\/\/[^\s"'<>]+$/i.test(url) && url.length <= 1000;
// Only real landscape preview images are kept; logos and odd shapes fall back to the illustration.
function coverCheck(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h || w < 600 || w / h < 1.4 || w / h > 2.4) img.remove();
}
function resCover(r) {
  return `<div class="res-cover" aria-hidden="true">${RES_ART[r.category] || RES_ART.Learning}${coverOk(r.image_url) ? `<img src="${esc(r.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="coverCheck(this)" onerror="this.remove()">` : ''}</div>`;
}
// For the HerTech team: fill in missing cover images quietly in the background, at most once a day per browser.
let coversRunning = false;
async function autoCovers() {
  if (coversRunning || !sb) return;
  const todo = db.resources.filter(r => r.status === 'approved' && !r.image_url);
  if (!todo.length) return;
  const key = 'hertech-covers-' + new Date().toISOString().slice(0, 10);
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, 'running'); } catch { return; }
  coversRunning = true;
  let found = 0;
  for (const r of todo) {
    const result = await findCover(r);
    if (result === 'limit') break;
    if (result === 'ok') found++;
    await new Promise(done => setTimeout(done, 1200));
  }
  coversRunning = false;
  if (found) await refresh();
}
// Ask Microlink (free link-preview service) for a site's preview image; save it only if it is a proper landscape cover.
async function findCover(r) {
  try {
    const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(r.url));
    if (res.status === 429) return 'limit';
    const img = (await res.json())?.data?.image;
    if (!img || !coverOk(img.url) || !(img.width >= 600) || img.width / img.height < 1.4 || img.width / img.height > 2.4) return 'none';
    const {error} = await sb.from('resources').update({image_url:img.url}).eq('id', r.id);
    return error ? 'error' : 'ok';
  } catch { return 'error'; }
}

function galleryMarkup(s) {

async function loadSwapImages(id) {
  const s = db.swaps.find(item => item.id === id);
  if (!s || swapImages.has(id) || !s.cover) return;
  const {data} = await sb.from('swaps').select('images').eq('id', id).maybeSingle();
  swapImages.set(id, Array.isArray(data?.images) ? data.images : []);
  const box = document.querySelector('#swapGallery');
  if (box && route().path === 'swap-' + id) box.innerHTML = galleryMarkup(s);
}

// ───────────────────────── Messages ─────────────────────────
function conversations() {
  const map = new Map();
  for (const m of db.messages) {
    const other = m.sender_id === me.id ? m.recipient_id : m.sender_id;
    const c = map.get(other) || {other, last:null, unread:0};
    c.last = m;
    if (m.recipient_id === me.id && !m.read_at) c.unread++;
    map.set(other, c);
  }
  return [...map.values()].sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));
}
function inboxPage() {
  if (!me) return loginPrompt('Log in to see your messages.');
  const list = conversations();
  return `<section class="detail"><h1>Messages</h1><p class="section-note">Private conversations between you and other members.</p>
    ${list.map(c => `<a class="card convo${c.unread ? ' unread' : ''}" href="#messages-${esc(c.other)}">${avatar(c.other)}<div class="convo-text"><strong>${esc(nameOf(c.other))}</strong><span class="summary clamp1">${c.last.sender_id === me.id ? 'You: ' : ''}${esc(c.last.body)}</span></div><div class="convo-side"><small>${ago(c.last.created_at)}</small>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div></a>`).join('')
      || '<p class="empty">No messages yet. Open a member’s profile or a swap listing and press “Message” to start a conversation.</p>'}</section>`;
}
function threadPage(otherId) {
  if (!me) return loginPrompt('Log in to send messages.');

  if (!other || otherId === me.id) return '<section class="detail"><a class="back" href="#messages">← Messages</a><p class="empty">This member can’t be found.</p></section>';
  const isBlocked = blocked(otherId);
  return `<section class="detail thread"><a class="back" href="#messages">← Messages</a>
    <div class="thread-head">${avatar(otherId)}<div><a class="member-link" href="#member-${esc(otherId)}">${esc(other.name)}</a><p class="meta">${esc(other.stage || 'Member')}</p></div>
    <button class="ghost small" data-action="block" data-id="${esc(otherId)}">${isBlocked ? 'Unblock' : 'Block'}</button></div>
    <div id="threadBody" class="thread-body" aria-live="polite"></div>
    ${isBlocked ? '<p class="empty">You’ve blocked this member. Unblock them to send messages.</p>' : `<form id="composer" class="composer"><label class="visually-hidden" for="composerText">Message</label><textarea id="composerText" name="body" rows="2" maxlength="2000" required placeholder="Write a message… (Ctrl + Enter to send)">${esc(ui.composerDraft || '')}</textarea><button class="primary" type="submit">Send</button></form>
    <p class="form-note">Be kind. Never share passwords, bank details or ID documents in messages.</p>`}</section>`;
}
function renderThreadBody() {
  const box = document.querySelector('#threadBody');
  const otherId = route().path.slice(9);
  if (!box || !me) return;
  const list = db.messages.filter(m => (m.sender_id === me.id && m.recipient_id === otherId) || (m.sender_id === otherId && m.recipient_id === me.id));
  let lastDay = '';
  box.innerHTML = list.map(m => {
    const day = new Date(m.created_at).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
    const sep = day !== lastDay ? `<p class="day">${esc(day)}</p>` : '';
    lastDay = day;
    return `${sep}<div class="bubble ${m.sender_id === me.id ? 'mine' : 'theirs'}"><p>${esc(m.body)}</p><small>${new Date(m.created_at).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}${m.sender_id === me.id && m.read_at ? ' · Seen' : ''}${m.sender_id !== me.id ? ' · ' + reportBtn('message', m.id, m.sender_id) : ''}</small></div>`;
  }).join('') || `<p class="empty">Say hello to ${esc(nameOf(otherId))} 👋</p>`;
  box.scrollTop = box.scrollHeight;
}

// Turns free text like "CV reviews, Python basics" into shared topics, so offers and wants can be compared.
const MATCH_TOPICS = [
  ['CV & cover letters', /\b(cv|cvs|resume|résumé|cover letters?)\b/],
  ['Interviews', /\b(interview\w*|mock|leetcode|behaviou?ral|star method)\b/],

  ['AI & machine learning', /\b(ai|machine learning|ml|deep learning|llms?|nlp|computer vision)\b/],
  ['Web development', /\b(web|html|css|javascript|js|typescript|react|front ?end|frontend|back ?end|backend|full ?stack|node)\b/],
  ['Design & UX', /\b(design|ux|ui|figma|user research|product design)\b/],
  ['Product management', /\b(product manag\w*|pm|roadmap)\b/],
  ['Cloud & DevOps', /\b(cloud|aws|azure|gcp|devops|docker|kubernetes)\b/],
  ['Cyber security', /\b(cyber|security|infosec)\b/],
  ['Robotics & hardware', /\b(robot\w*|arduino|hardware|embedded|electronics|cad|3d print\w*)\b/],
  ['Coding basics', /\b(cod(e|ing)|programming|git|github|java|c\+\+|c#)\b/],
  ['Mentoring & career advice', /\b(mentor\w*|career|advice|guidance|job hunt\w*|job search\w*|grad(uate)? schemes?|internships?)\b/],
  ['Visas & moving to the UK', /\b(visa|visas|sponsor\w*|graduate route|right to work)\b/],
  ['Networking & events', /\b(network\w*|events?|meetups?|hackathons?|buddy|buddies)\b/],
  ['Housing & home swaps', /\b(housing|room|flat|home swap|accommodation|stay)\b/],
  ['English & communication', /\b(english|ielts|presentation|public speaking|communication|writing)\b/]
];
function matchTopics(text) {
  const t = ' ' + String(text || '').toLowerCase() + ' ';
  return new Set(MATCH_TOPICS.filter(([, re]) => re.test(t)).map(([name]) => name));
}
const overlap = (a, b) => [...a].filter(x => b.has(x));
// People whose offers meet my wants, and whose wants I can meet. Two-way matches rank first.
function matchesFor(id, limit = 3) {
  const mine = profile(id);
  if (!mine) return [];
  const myOffers = matchTopics(mine.offers), myWants = matchTopics(mine.wants);
  if (!myOffers.size && !myWants.size) return [];
  return [...db.profiles.values()]
    .filter(p => p.id !== id && !p.is_banned && !blocked(p.id) && (p.offers || p.wants))
    .map(p => {
      const canHelpMe = overlap(myWants, matchTopics(p.offers));
      const iCanHelp = overlap(myOffers, matchTopics(p.wants));
      const score = canHelpMe.length * 2 + iCanHelp.length * 1.5 + (canHelpMe.length && iCanHelp.length ? 3 : 0);
      return {p, canHelpMe, iCanHelp, score};
    })
    .filter(m => m.score > 0)
    .sort((a, b) => b.score - a.score || String(b.p.created_at).localeCompare(String(a.p.created_at)))
    .slice(0, limit);
}

function dataUrlToBlob(url) {
  const [head, b64] = url.split(',');
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], {type:'image/jpeg'});
}
async function squareAvatar(file) {
  const bitmap = await createImageBitmap(file);
  try {
    const size = Math.min(bitmap.width, bitmap.height);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 400;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 400, 400);
    ctx.drawImage(bitmap, (bitmap.width - size) / 2, (bitmap.height - size) / 2, size, size, 0, 0, 400, 400);
    return dataUrlToBlob(canvas.toDataURL('image/jpeg', 0.85));
  } finally { bitmap.close(); }
}
async function uploadPhoto(bucket, blob) {
  const path = me.id + '/' + (crypto.randomUUID?.() || Date.now().toString(36)) + '.jpg';
  const {error} = await sb.storage.from(bucket).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if (error) throw error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
async function compressImage(file) {
  const bitmap = await createImageBitmap(file);
  try {
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    const ratio = Math.min(1, 1200 / Math.max(bitmap.width, bitmap.height));
    for (const scale of [1, 0.7, 0.45]) {
      canvas.width = Math.max(1, Math.round(bitmap.width * ratio * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * ratio * scale));
      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL('image/jpeg', 0.78);
      if (data.length <= 230000) return data;
    }
    throw new Error('Image could not be compressed');
  } finally { bitmap.close(); }
}

        let avatar_url;
        if (ui.avatarFile) {
          try { avatar_url = await uploadPhoto('avatars', await squareAvatar(ui.avatarFile)); }
          catch (error) { console.error(error); say('We couldn’t upload that photo. Try another one, or save without it.'); return; }
        }
        if (activeForm === 'welcome') {
          try { localStorage.setItem('hertech-welcome-' + me.id, '1'); } catch {}
          const update = {bio:value('bio'), offers:value('offers'), wants:value('wants')};
          if (avatar_url) update.avatar_url = avatar_url;
          ok = await run(() => sb.from('profiles').update(update).eq('id', me.id), 'Welcome to HerTech! 🎉');
          if (ok && (update.offers || update.wants)) after = '#matches';
          break;
        }
        const link = value('link');
        if (link && !safeUrl(link)) { say('Links must start with https://'); return; }
        const update = {name:value('name'), stage:value('stage'), bio:value('bio'), offers:value('offers'), wants:value('wants'), link};
        update.email_notifications = data.get('email_notifications') === 'on';
        if (avatar_url) update.avatar_url = avatar_url;
        ok = await run(() => sb.from('profiles').update(update).eq('id', me.id), 'Profile saved.');
        break;
      }
      case 'redeem': {
        const res = await run(() => sb.rpc('redeem_ticket', {event:TICKET}));
        const messages = {ok:'Ticket redeemed. Your booking is confirmed.', already:'You already have a ticket.', full:'Sorry, this workshop is fully booked.', balance:'You need ' + PRICE + ' Coffee Beans to redeem a ticket.', login:'Log in first.'};
        if (res) tell(messages[res.data] || 'Couldn’t redeem the ticket.');
        ok = res;
        break;
      }
    }
  } finally { submit.disabled = false; }
  // Errors also show inside the form, because the page notice sits behind an open dialog.
  if (!ok) { if (lastError && message && message.hidden) say(lastError); return; }
  ui.eventDraft = null;
  dialog.close();
  await refresh();
  if (after) go(after);
});

// ───────────────────────── Clicks ─────────────────────────
document.addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const {action, topic, id, target} = button.dataset;
  switch (action) {
    case 'cancel': if (activeForm === 'welcome' && me) { try { localStorage.setItem('hertech-welcome-' + me.id, '1'); } catch {} } resumeAsk = false; dialog.close(); return;
    case 'report-filter': ui.reportFilter = topic; render(); return;
    case 'reload': db.loaded = false; render(); loadAll(); return;
    case 'topic': ui.qTopic = topic; go('#questions'); return;
    case 'q-topic': ui.qTopic = topic; render(); return;
    case 'q-sort': ui.qSort = topic; render(); return;
    case 'answer-sort': ui.answerSort = topic; render(); return;
    case 'res-cat': ui.resCat = topic; render(); return;
    case 'swap-type': ui.swapType = topic; render(); return;
    case 'clear-stay': ui.stay = {from:'', to:''}; render(); return;
    case 'city': if (eventCities().includes(topic)) { ui.city = topic; render(); } return;
    case 'copy-link':
      try { await navigator.clipboard.writeText(location.href); tell('Link copied.'); } catch { tell('Copy the address from your browser bar.'); }
      return;
    case 'pin': {
      const ev = visibleEvents()[Number(id)], pin = pins[Number(id)];
      if (!ev || !ev.marker) return;
      if (!eventMap || !pin) { const [lat, lon] = ev.marker; window.open('https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=16/' + lat + '/' + lon, '_blank', 'noopener,noreferrer'); return; }
      document.querySelector('#eventMap').scrollIntoView({block:'nearest'});
      eventMap.setView(pin.getLatLng(), 16); pin.openPopup();
      return;
    }
    case 'swap-image': {
      const img = button.querySelector('img').cloneNode();
      img.className = 'exchange-full-image';
      activeForm = '';
      dialog.innerHTML = '<h2 id="dialogTitle">Photo</h2><div class="actions"><button type="button" data-action="cancel">Close</button></div>';
      dialog.querySelector('.actions').before(img);
      dialog.showModal();
      return;
    }
    case 'logout':
      button.disabled = true;
      try { const {error} = await auth.signOut({scope:'local'}); if (error) throw error; await setUser(null); go('#home'); tell('You’re logged out.'); }
      catch { tell('Couldn’t log out. Please try again.'); button.disabled = false; }
      return;
  }
  if (authForms.includes(action)) { showForm(action); return; }
  // Everything below needs an account
  if (['ask','answer','comment','vote','edit-question','edit-answer','event-group','event-comment','event-reply','group-join','new-swap','swap-message','swap-status','share-resource','res-vote','follow','block','edit-profile','redeem','delete','res-review','report','report-status','suspend','new-event','delete-event','find-covers'].includes(action) && needLogin()) {
    if (action === 'ask') resumeAsk = true;
    return;
  }
  switch (action) {
    case 'ask': showForm('ask', {title: button.dataset.title}); break;
    case 'answer': ui.editing = {id}; showForm('answer'); break;
    case 'edit-question': ui.editing = db.questions.find(q => q.id === id); showForm('edit-question'); break;
    case 'edit-answer': ui.editing = db.answers.find(a => a.id === id); showForm('edit-answer'); break;
    case 'comment': ui.commentTarget = {type:button.dataset.type, id}; showForm('comment'); break;
    case 'vote': {
      const mine = db.votes.find(v => v.answer_id === id && v.voter_id === me.id);
      button.disabled = true;
      if (await run(() => mine ? sb.from('answer_votes').delete().eq('answer_id', id).eq('voter_id', me.id) : sb.from('answer_votes').insert({answer_id:id}))) await refresh();
      break;
    }
    case 'event-group': case 'event-comment': case 'event-reply': {
      ui.expandedEvents.add(id);
      const parent = action === 'event-reply' ? db.comments.find(c => c.id === target) : null;
      ui.eventDraft = {id, replyTo:parent?.id, groupId:parent?.group_id || (action === 'event-comment' ? target : undefined)};
      showForm(action === 'event-group' ? 'event-group' : 'event-comment');
      break;
    }
    case 'group-join': {
      ui.expandedEvents.add(id);
      const joined = db.groupMembers.some(x => x.group_id === target && x.member_id === me.id);
      if (await run(() => joined ? sb.from('event_group_members').delete().eq('group_id', target).eq('member_id', me.id) : sb.from('event_group_members').insert({group_id:target}), joined ? 'You left the group.' : 'You joined the group.')) await refresh();
      break;
    }
    case 'new-swap': showForm('swap-post', {type:button.dataset.type}); break;
    case 'swap-message': {
      const s = db.swaps.find(x => x.id === id);
      if (!s) return;
      ui.composerDraft = `Hi ${nameOf(s.author_id).split(/[ ·]/)[0]}! I’m interested in your swap “${s.title}”. `;
      go('#messages-' + s.author_id);
      break;
    }
    case 'swap-status':
      if (await run(() => sb.from('swaps').update({status:button.dataset.status}).eq('id', id), button.dataset.status === 'closed' ? 'Marked as swapped. Congratulations!' : 'Listing reopened.')) await refresh();
      break;
    case 'share-resource': showForm('share-resource'); break;
    case 'res-vote': {
      const mine = db.resourceVotes.some(v => v.resource_id === id && v.member_id === me.id);
      button.disabled = true;
      if (await run(() => mine ? sb.from('resource_votes').delete().eq('resource_id', id).eq('member_id', me.id) : sb.from('resource_votes').insert({resource_id:id}))) await refresh();
      break;
    }
    case 'scroll-to':
      document.getElementById(id)?.scrollIntoView({behavior:'smooth', block:'start'});
      break;
    case 'res-review': {
      const approved = button.dataset.status === 'approved';
      if (await run(() => sb.from('resources').update({status:button.dataset.status, is_pick:button.dataset.pick === 'true'}).eq('id', id), approved ? 'Resource approved.' : 'Resource rejected.')) {
        const r = db.resources.find(x => x.id === id);
        if (approved && r && !r.image_url) await findCover(r);
        await refresh();
      }
      break;
    }
    case 'find-covers': {
      button.disabled = true;
      let found = 0, limit = false;
      for (const r of db.resources.filter(x => x.status === 'approved' && !x.image_url)) {
        button.textContent = 'Looking… ' + found + ' found';
        const result = await findCover(r);
        if (result === 'limit') { limit = true; break; }
        if (result === 'ok') found++;
        await new Promise(done => setTimeout(done, 1200));
      }
      tell(found + ' cover image' + (found === 1 ? '' : 's') + ' found.' + (limit ? ' The free preview service’s daily limit was reached; try again tomorrow.' : ''));
      await refresh();
      break;
    }
    case 'follow': {
      const following = db.follows.some(f => f.follower_id === me.id && f.followee_id === id);
      if (await run(() => following ? sb.from('follows').delete().eq('follower_id', me.id).eq('followee_id', id) : sb.from('follows').insert({followee_id:id}))) await refresh();
      break;
    }
    case 'block': {
      const isBlocked = blocked(id);
      if (!isBlocked && button.dataset.armed !== 'yes') { button.dataset.armed = 'yes'; button.textContent = 'Click again to block'; setTimeout(() => { if (button.isConnected) { button.dataset.armed = ''; button.textContent = 'Block'; } }, 4000); return; }
      if (await run(() => isBlocked ? sb.from('blocks').delete().eq('blocker_id', me.id).eq('blocked_id', id) : sb.from('blocks').insert({blocked_id:id}), isBlocked ? 'Unblocked.' : 'Blocked. They can no longer message you.')) { await loadPrivate(); render(); }
      break;
    }
    case 'edit-profile': showForm('edit-profile'); break;
    case 'report': ui.reportTarget = {type:button.dataset.type, id}; showForm('report'); break;
    case 'report-status':
      if (await run(() => sb.from('reports').update({status:button.dataset.value}).eq('id', id), button.dataset.value === 'open' ? 'Report reopened.' : 'Report updated.')) { await loadPrivate(); render(); }
      break;
    case 'suspend': {
      const on = button.dataset.value === 'true';
      if (on && button.dataset.armed !== 'yes') { button.dataset.armed = 'yes'; button.textContent = 'Click again to suspend'; setTimeout(() => { if (button.isConnected) { button.dataset.armed = ''; button.textContent = 'Suspend member'; } }, 4000); return; }
      const res = await run(() => sb.rpc('set_suspended', {member:id, suspended:on}));
      if (res) { tell(res.data === 'ok' ? (on ? 'Member suspended. She can still read but can’t post or message.' : 'Member restored.') : res.data === 'admin' ? 'Admins can’t be suspended.' : 'Only admins can do this.'); await refresh(); }
      break;
    }
    case 'new-event': showForm('new-event'); break;
    case 'delete-event': {
      if (button.dataset.armed !== 'yes') { button.dataset.armed = 'yes'; button.textContent = 'Click again to remove'; setTimeout(() => { if (button.isConnected) { button.dataset.armed = ''; button.textContent = 'Remove event'; } }, 4000); return; }
      if (await run(() => sb.from('events').delete().eq('id', id), 'Event removed.')) await refresh();
      break;
    }
    case 'redeem': showForm('redeem'); break;
    case 'delete': {
      if (button.dataset.armed !== 'yes') { button.dataset.armed = 'yes'; const label = button.textContent; button.textContent = 'Click again to delete'; setTimeout(() => { if (button.isConnected) { button.dataset.armed = ''; button.textContent = label; } }, 4000); return; }
      const table = button.dataset.table;
      if (!['questions','answers','comments','swaps','resources','event_groups'].includes(table)) return;
      if (await run(() => sb.from(table).delete().eq('id', id), 'Deleted.')) { await refresh(); if (button.dataset.after) go(button.dataset.after); }
      break;
    }
  }
});

// ───────────────────────── Page forms & live filters ─────────────────────────
app.addEventListener('submit', async event => {
  const form = event.target;
  if (['homeSearch','pageSearch','searchForm'].includes(form.id)) {
    event.preventDefault();
    const q = String(new FormData(form).get('q') || '').trim();
    go('#search' + (q ? '?q=' + encodeURIComponent(q) : ''));
    return;
  }
  if (form.id === 'quickAsk') {
    event.preventDefault();
    ui.draftTitle = String(new FormData(form).get('title') || '').trim().replace(/\s*\n\s*/g, ' ');
    if (!ui.draftTitle) return tell('Enter a question title.');
    if (!me) { resumeAsk = true; showForm('login'); return; }
    showForm('ask', {title: ui.draftTitle});
    return;
  }
  if (form.id === 'stayFilter') {
    event.preventDefault();
    const data = new FormData(form);
    const from = String(data.get('from') || ''), to = String(data.get('to') || from);
    if (!from || from < ukDate() || to < from) return tell('Choose a valid start and end date.');
    ui.stay = {from, to};
    render();
    return;
  }
  if (form.id === 'composer') {
    event.preventDefault();
    await sendMessage(form);
  }
});
async function sendMessage(form) {
  const text = form.querySelector('textarea');
  const body = text.value.trim();
  const otherId = route().path.slice(9);
  const button = form.querySelector('[type=submit]');
  if (!body || !me || button.disabled) return;
  button.disabled = true;
  const res = await run(() => sb.from('messages').insert({recipient_id:otherId, body}).select('*').single());
  button.disabled = false;
  if (!res) return;
  notify('message', res.data.id);
  text.value = '';
  if (!db.messages.some(m => m.id === res.data.id)) db.messages.push(res.data);
  renderThreadBody();
  text.focus();
}
app.addEventListener('keydown', event => {
  if (event.target.id === 'composerText' && event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    event.target.form.requestSubmit();
  }
});
let liveTimer;
app.addEventListener('input', event => {
  const el = event.target;
  if (el.id === 'searchInput') {
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => {
      const params = route().params;
      params.set('q', el.value);
      history.replaceState(null, '', '#search?' + params.toString());
      document.querySelector('#searchResults').innerHTML = searchResults(params);
    }, 220);
  }
  if (el.dataset.live) liveFilter(el);
});
app.addEventListener('change', event => { if (event.target.dataset.live) liveFilter(event.target); });
function liveFilter(el) {
  if (el.dataset.live === 'resources') {
    ui.resText = document.querySelector('#resText').value;
    ui.resCost = document.querySelector('#resCost').value;
    document.querySelector('#liveList').innerHTML = resourceList();
  } else if (el.dataset.live === 'swaps') {
    ui.swapText = document.querySelector('#swapText').value;
    ui.swapOpen = document.querySelector('#swapOpen').checked;
    document.querySelector('#liveList').innerHTML = swapList();
  }
}

// ───────────────────────── Accounts ─────────────────────────
function maybeWelcome() {
  const p = me && profile(me.id);
  if (!p || p.bio || p.offers || p.wants || dialog.open) return;
  try { if (localStorage.getItem('hertech-welcome-' + me.id)) return; } catch { return; }
  showForm('welcome');
}
async function setUser(user) {
  const next = user?.email_confirmed_at ? user : null;
  const changed = next?.id !== me?.id;
  me = next;
  if (!changed) { renderHeader(); return; }
  unsubscribeMessages();
  if (me && db.loaded && !db.profiles.has(me.id)) { await loadAll(); }
  else { await loadPrivate(); render(); }
  if (me) subscribeMessages();
  maybeWelcome();
}
function authError(error) {
  const messages = {
    invalid_credentials:'Incorrect email or password.',
    email_not_confirmed:'Your email is awaiting verification. Open the verification email or request a new one.',
    email_address_not_authorized:'We can’t send emails to this address yet. HerTech is still in testing.',
    over_email_send_rate_limit:'Too many requests. Please try again later.',
    weak_password:'Choose a stronger password.'
  };
  return messages[error?.code] || 'We couldn’t complete this account action. Please try again later.';
}
async function submitAuth(kind, form, data) {
  const message = form.querySelector('[data-form-message]');
  const submit = form.querySelector('[type=submit]');
  if (submit.disabled || !auth) return;
  const email = String(data.get('email') || '').trim().toLowerCase();
  const password = String(data.get('password') || '');
  const name = String(data.get('name') || '').trim();
  const say = text => { message.textContent = text; message.hidden = false; };
  if (kind === 'join' && !name) { say('Enter a display name.'); return; }
  submit.disabled = true;
  say('Working…');
  try {
    if (kind === 'join') {
      const {error} = await auth.signUp({email, password, options:{emailRedirectTo:authRedirect, data:{name, stage:data.get('stage')}}});
      if (error) throw error;
      form.querySelector('[name=password]').value = '';
      say('If this address can be registered, you’ll receive a verification email. Verify your address before logging in.');
    } else if (kind === 'login') {
      const {data:result, error} = await auth.signInWithPassword({email, password});
      if (error) throw error;
      if (!result.user?.email_confirmed_at) { await auth.signOut({scope:'local'}); say(authError({code:'email_not_confirmed'})); return; }
      if (form.isConnected && dialog.open) dialog.close();
      await setUser(result.user);
      tell('You’re logged in to HerTech.');
      if (resumeAsk) { resumeAsk = false; showForm('ask'); }
    } else if (kind === 'forgot') {
      const {error} = await auth.resetPasswordForEmail(email, {redirectTo:authRedirect});
      if (error) throw error;
      say('If there’s an account for this address, a reset link is on its way. Open it on this device.');
    } else if (kind === 'new-password') {
      if (password.length < 10) { say('Use at least 10 characters.'); return; }
      if (password !== String(data.get('password2') || '')) { say('The two passwords don’t match.'); return; }
      const {error} = await auth.updateUser({password});
      if (error) throw error;
      if (dialog.open) dialog.close();
      tell('Password updated. You’re logged in.');
    } else if (kind === 'resend') {
      const {error} = await auth.resend({type:'signup', email, options:{emailRedirectTo:authRedirect}});
      if (error) throw error;
      say('If a registration for this address is awaiting verification, a new email will be sent.');
    } else {
      const {error} = await auth.updateUser({email}, {emailRedirectTo:authRedirect});
      if (error) throw error;
      say('Follow the instructions in the verification email to confirm the change.');
    }
  } catch (error) {
    say(authError(error));
  } finally {
    submit.disabled = false;
  }
}

window.addEventListener('hashchange', () => { ui.answerSort = 'popular'; render(); window.scrollTo(0, 0); });
render();
(async () => {
  if (auth) {
    const {data} = await auth.getSession();
    me = data.session?.user?.email_confirmed_at ? data.session.user : null;
    auth.onAuthStateChange((evt, session) => { setTimeout(() => { setUser(evt === 'SIGNED_OUT' ? null : session?.user); if (evt === 'PASSWORD_RECOVERY') showForm('new-password'); }, 0); });
  }
  await loadAll();
  if (me) { subscribeMessages(); maybeWelcome(); }
})();
</script>
