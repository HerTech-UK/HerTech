async function compressExchangeImage(file) {

    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');

    for (const scale of [1, 0.7, 0.45]) {
      canvas.width = Math.max(1, Math.round(bitmap.width * ratio * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * ratio * scale));
      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL('image/jpeg', 0.78);

    }

}

    const {name, stage} = verifiedUser.user_metadata || {};
    state.members.push({id:verifiedUser.id,name:String(name || 'HerTech member').slice(0,30),stage:String(systemLabel(legacyStages, stage) || '').slice(0,40)});
    credit(verifiedUser.id, 2, 'Welcome Coffee Beans', 'join-' + verifiedUser.id);
  }
  render();
}
function authError(error) {
  const messages = {
    invalid_credentials:'Incorrect email or password.',
    email_not_confirmed:'Your email is awaiting verification. Open the verification email or request a new one.',
    email_address_not_authorized:'Test emails can currently be sent only to Supabase project team members.',
    over_email_send_rate_limit:'Too many requests. Please try again later.',
    weak_password:'Choose a stronger password.'
  };
  return messages[error?.code] || 'We couldn’t complete this account action. Please try again later.';
}
async function submitAuth(kind, form, data) {
  const message = form.querySelector('[data-form-message]');
  const submit = form.querySelector('[type=submit]');
  if (submit.disabled || !auth) return;
  const email = String(data.get('email') || '').trim().toLowerCase();
  const password = String(data.get('password') || '');
  const name = String(data.get('name') || '').trim();
  const setMessage = text => { message.textContent = text; message.hidden = false; };
  if (kind === 'join' && !name) { setMessage('Enter a display name.'); return; }
  submit.disabled = true;
  setMessage('Working…');
  try {
    if (kind === 'join') {
      const {error} = await auth.signUp({email,password,options:{emailRedirectTo:authRedirect,data:{name,stage:data.get('stage')}}});
      if (error) throw error;
      form.querySelector('[name=password]').value = '';
      setMessage('If this address can be registered, you’ll receive a verification email. Verify your address before logging in.');
    } else if (kind === 'login') {
      const {data:result,error} = await auth.signInWithPassword({email,password});
      if (error) throw error;
      if (!result.user?.email_confirmed_at) {
        await auth.signOut({scope:'local'});
        setMessage(authError({code:'email_not_confirmed'}));
        return;
      }
      syncUser(result.user);
      if (form.isConnected && dialog.open) {
        dialog.close();
        if (resumeAsk) {
          resumeAsk = false;
          showForm('ask');
        }
      }
      tell('You’re logged in to HerTech.');
    } else if (kind === 'resend') {
      const {error} = await auth.resend({type:'signup',email,options:{emailRedirectTo:authRedirect}});
      if (error) throw error;
      setMessage('If a registration for this address is awaiting verification, a new email will be sent.');
    } else {
      const {error} = await auth.updateUser({email},{emailRedirectTo:authRedirect});
      if (error) throw error;
      setMessage('Follow the instructions in the verification email to confirm the change.');
    }
  } catch (error) {
    setMessage(authError(error));
  } finally {
    submit.disabled = false;
  }
}
window.addEventListener('hashchange', () => { sort = 'popular'; render(); window.scrollTo(0, 0); });
render();
if (auth) {
  auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') syncUser(null);
    else syncUser(session?.user);
  });
}
</script>
